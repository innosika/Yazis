# Built-in pronunciation lexicon for computer-science text.
#
# `words`   - how a term is said; matched as a whole word, case-sensitively.
#             Respellings are plain English spellings the synthesizer reads well.
# `spell`   - acronyms that are always spelled letter by letter even though they
#             look pronounceable (the heuristic would otherwise read them as words).
# Users extend this in Settings -> Pronunciation; their entries win.

