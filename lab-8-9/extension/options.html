<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Lector options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #1b1d22; }
  input { width: 100%; height: 34px; padding: 0 10px; border: 1px solid #cfcdc4; border-radius: 8px; font: inherit; }
  button { margin-top: 12px; height: 34px; padding: 0 14px; border: 0; border-radius: 8px; background: #1d3b8a; color: #fff; font: inherit; cursor: pointer; }
  p { color: #5c5f66; }
</style></head>
<body>
  <h1 style="font: 600 20px Georgia, serif">Lector server</h1>
  <p>Where Lector runs. The default matches <code>make up</code>. Other addresses need the extension's host permissions updated in manifest.json.</p>
  <label for="base">Address</label>
  <input id="base" placeholder="http://localhost:8100" />
  <button id="save">Save</button> <span id="saved" style="margin-left:8px;color:#1f7a4d"></span>
  <script src="options.js"></script>
</body></html>
