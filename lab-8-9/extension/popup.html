<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Lector</title>
<style>
  :root { color-scheme: light dark; --ink:#1b1d22; --muted:#5c5f66; --line:#e4e3dc; --paper:#fcfcfa; --accent:#1d3b8a; --marker:#ffe57a; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e6e8ee; --muted:#a0a6b3; --line:#262c38; --paper:#12151c; --accent:#93abff; } }
  body { margin:0; width: 300px; font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); background: var(--paper); }
  header { display:flex; align-items:center; gap:8px; padding: 14px 16px 10px; }
  .mark { font: 600 17px Georgia, serif; position: relative; }
  .mark span { background: linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 88%, transparent 88%); }
  .status { margin-left:auto; font-size: 12px; color: var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius: 99px; background:#8b8e94; }
  .dot.ok { background:#1f7a4d; } .dot.bad { background:#b42318; }
  main { padding: 0 16px 14px; display:grid; gap: 12px; }
  label { display:grid; gap:4px; color: var(--ink); }
  select, input[type=range] { width: 100%; }
  select { height: 30px; border-radius: 8px; border:1px solid var(--line); background: transparent; color: var(--ink); padding: 0 6px; }
  .row { display:flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  button { height: 32px; border-radius: 8px; border: 0; background: var(--accent); color: #fff; font-weight: 500; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button { color: #0c1532; } }
  a { color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<header>
  <span class="mark"><span>Lec</span>tor</span>
  <span class="status"><span id="dot" class="dot"></span><span id="state">Checking…</span></span>
</header>
<main>
  <label>Voice <select id="voice"></select></label>
  <label><span class="row"><span>Speed</span><span id="speedv">1.0×</span></span>
    <input id="speed" type="range" min="0.5" max="2" step="0.05" /></label>
  <button id="read">Read the selection on this page</button>
  <p class="hint">Or select text and press the ▶ button next to it, right-click → Read aloud with Lector, or Alt+R.</p>
  <p class="hint"><a id="open" href="#">Open Lector</a> · <a href="options.html" target="_blank">Server address</a></p>
</main>
<script src="popup.js"></script>
</body>
</html>
