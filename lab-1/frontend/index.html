<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Information retrieval system — vector search model over a web-crawled English corpus."
    />
    <title>Information Retrieval System</title>
    <!-- Apply a saved explicit theme before the first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("irs.theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
