[mypy]
python_version = 3.12
strict = True
warn_unused_ignores = True
pretty = True

# pymorphy3 and spaCy's thinc arrays ship no type information. Declaring that once here is
# honest; scattering `type: ignore` through the linguistics code would hide real errors.
[mypy-pymorphy3,pymorphy3.*]
ignore_missing_imports = True

[mypy-spacy,spacy.*]
ignore_missing_imports = True

[mypy-thinc,thinc.*]
ignore_missing_imports = True
